# Use the authenticated DeepSeek account provider with the installed local
# credential/authorization plugins. No credential values are stored here.
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-account
    model: deepseek-flash
- id: authorization
  name: '@deepseek-ai/dsh-authorization'
  disabled: false
- id: deepseek-account
  name: '@deepseek-ai/dsh-deepseek-account'
  disabled: false
  config:
    desktopPlatform: win32
- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'
  disabled: false
